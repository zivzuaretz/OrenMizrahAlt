<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063d35">
  <meta name="description" content="אורן מזרח X אלטשולר שחם - הארגזים בדרך!">
  <meta property="og:locale" content="he_IL">
  <meta property="og:type" content="website">
  <meta property="og:title" content="בדרך לרבע מיליארד עם אורן מזרח 💎">
  <meta property="og:description" content="אורן מזרח X אלטשולר שחם - הארגזים בדרך!">
  <meta property="og:url" content="https://zivzuaretz.github.io/OrenMizrahAlt/?v=20260727-35">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="בדרך לרבע מיליארד עם אורן מזרח 💎">
  <meta name="twitter:description" content="אורן מזרח X אלטשולר שחם - הארגזים בדרך!">
  <link rel="canonical" href="https://zivzuaretz.github.io/OrenMizrahAlt/">
  <title>בדרך לרבע מיליארד עם אורן מזרח 💎</title>
  <link rel="stylesheet" href="styles.css?v=20260727-35">
</head>
<body>
  <a class="skip-link" href="#main">דלגו לתוכן הראשי</a>
  <main id="main" class="shell">
    <section class="hero" aria-labelledby="campaign-title">
      <div class="hero-brand brand-lockup">
        <img class="brand-logo brand-logo--oren" src="assets/oren-mizrah-logo.png" alt="אורן מזרח">
        <div class="partnership" aria-hidden="true"><span></span><i>×</i><span></span></div>
        <img class="brand-logo brand-logo--altshuler" src="assets/altshuler-logo.png" alt="אלטשולר שחם">
      </div>
      <div class="hero__copy">
        <h1 id="campaign-title"><span>בדרך ל<strong class="campaign-target">רבע מיליארד</strong></span><span>עם אורן מזרח 💎</span></h1>
        <p class="hero__subtitle">מתקדמים יחד, עסקה אחר עסקה, אל היעד.</p>
      </div>
    </section>
    <div class="update-status">
      <span id="data-status">עודכן לאחרונה ב- <time id="last-updated">—</time> על ידי זיו זוארץ</span>
    </div>

    <section class="overview" aria-labelledby="overview-title">
      <h2 id="overview-title" class="sr-only">תמונת מצב כללית</h2>
      <div class="metric metric--primary metric--with-image">
        <div class="metric__image metric__image--sold"><img src="assets/oren-mizrah-owners.jpg" alt="הבעלים של אורן מזרח"></div>
        <span class="metric__label">נמכר עד כה 💰</span>
        <strong id="sold-total" class="metric__value">—</strong>
        <span class="metric__caption">מכלל הסוכנים</span>
      </div>
      <div class="metric metric--with-image">
        <div class="metric__image metric__image--remaining"><img src="assets/oren-mizrah-remaining.jpg" alt="צוות אורן מזרח"></div>
        <span class="metric__label">נותר ליעד 🎯</span>
        <strong id="remaining-total" class="metric__value">—</strong>
        <span class="metric__caption" id="target-caption">מתוך —</span>
      </div>
      <div class="metric metric--progress">
        <div class="metric__topline">
          <span class="metric__label">התקדמות ליעד 📈</span>
          <strong id="progress-percent">—</strong>
        </div>
        <div class="progress" role="progressbar" aria-label="התקדמות אל יעד המכירות" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress__fill"></div>
        </div>
        <span id="progress-status" class="metric__caption" aria-live="polite">טוען נתונים…</span>
      </div>
    </section>

    <section class="teams-section" aria-labelledby="teams-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">הנבחרות שלנו 🏆</p>
          <h2 id="teams-title" class="sr-only">קבוצות המכירות</h2>
        </div>
        <div class="section-meta">
          <span id="leader-status" class="leader-status"></span>
        </div>
      </div>
      <div id="teams" class="teams-grid" aria-live="polite"></div>
    </section>

  </main>

  <template id="team-template">
    <article class="team-card">
      <header class="team-card__header">
        <div class="team-photo-wrap">
          <span class="leader-badge" hidden>🏆 מובילים</span>
          <img class="team-photo" src="" alt="">
        </div>
        <div class="team-card__identity">
          <h3 class="team-card__name"></h3>
        </div>
        <div class="team-card__score">
          <strong class="team-card__total"></strong>
        </div>
      </header>
      <div class="agents"></div>
    </article>
  </template>

  <script src="app.js?v=20260727-35" defer></script>
</body>
</html>
